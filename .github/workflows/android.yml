# Сборка Android-приложения (APK + AAB для Google Play) в облаке GitHub — локально Android SDK не нужен.
# Запуск: вкладка Actions → «Android APK» → Run workflow, или пуш тега вида v1.0.0 (тогда APK прикрепится к релизу).
#
# Нужно один раз настроить в Settings → Secrets and variables → Actions:
#   Variables: TWA_HOST — домен сайта без https:// (например christine-korean.vercel.app)
#   Secrets:   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия (например 1.0.1)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      - name: Версия
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; fi
          if [ -z "$V" ]; then V="1.0.${{ github.run_number }}"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Ключ подписи
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Нет секрета ANDROID_KEYSTORE_BASE64"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Сборка
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: christine
        run: |
          HOST="${{ vars.TWA_HOST }}"
          if [ -z "$HOST" ]; then echo "::error::Задайте переменную TWA_HOST"; exit 1; fi
          gradle -p android assembleRelease bundleRelease --no-daemon \
            -PtwaHost="$HOST" -PversionName="${{ steps.ver.outputs.name }}" -PversionCode="${{ steps.ver.outputs.code }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Christine-${{ steps.ver.outputs.name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist/Christine-${{ steps.ver.outputs.name }}.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: Christine-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Релиз на GitHub
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.name) }}
          name: Christine ${{ steps.ver.outputs.name }}
          body: |
            Android-приложение Christine.
            **Установка:** скачайте `Christine-${{ steps.ver.outputs.name }}.apk` на телефон и откройте (разрешите установку из этого источника).
            Файл `.aab` — для публикации в Google Play.
          files: dist/*
