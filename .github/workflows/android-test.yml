# Диагностика: ставит APK из последнего релиза на эмулятор Android и сохраняет лог запуска (logcat) и скриншот.
name: Android test (emulator)

on:
  workflow_dispatch:
    inputs:
      api:
        description: 'API level эмулятора'
        default: '35'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Скачать APK из релиза
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo ${{ github.repository }} --pattern '*.apk' --output app.apk
          ls -la app.apk

      - name: Запуск на эмуляторе
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ github.event.inputs.api }}
          target: google_apis_playstore
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb shell "echo '_ --disable-fre --no-default-browser-check --no-first-run' > /data/local/tmp/chrome-command-line"
            adb shell am set-debug-app --persistent com.android.chrome
            adb install -r app.apk
            adb logcat -c
            adb shell am start -W -n app.christine.korean/com.google.androidbrowserhelper.trusted.LauncherActivity || true
            sleep 35
            adb exec-out screencap -p > screen.png || true
            adb logcat -d > logcat.txt || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > activity.txt || true
            adb shell pm list packages | grep -E "chrome|webview|browser" > browsers.txt || true
            echo "=== FATAL ==="; grep -E -A30 "FATAL EXCEPTION|AndroidRuntime" logcat.txt | head -80 || true
            echo "=== christine ==="; grep -iE "christine|TrustedWebActivity|LauncherActivity|TwaLauncher|customtabs" logcat.txt | head -60 || true
            echo "=== activity ==="; cat activity.txt; cat browsers.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-logs
          path: |
            logcat.txt
            screen.png
            activity.txt
            browsers.txt
